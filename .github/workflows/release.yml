name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: |
            vendor
            .catraca-cache
            .pint.cache
          key: ${{ runner.os }}-php-${{ hashFiles('composer.json', 'composer.lock', 'catraca_baseline.json', 'mago.toml') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate Package
        run: composer validate --no-check-publish

      - name: Run Unit Tests
        run: vendor/bin/phpunit --no-coverage

      - name: Check Verified Quality Gates
        # Keep release verification scoped to gates with a verified package baseline.
        # The full default also reports legacy style/static/coverage/duplication/
        # performance debt; widening those baselines would hide work rather than
        # prove this release is safe.
        run: ./bin/catraca check --gates=security,file_size --sequential --format=github --plain

      - name: Check Mago Formatting
        run: vendor/bin/mago format --check src

      - name: Check Mago Source Errors
        run: vendor/bin/mago analyze src --reporting-format=json --minimum-report-level=error --minimum-fail-level=error

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
